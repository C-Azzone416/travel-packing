# Weekly dependency and workflow-action update PRs (#22). Updates arrive as ordinary PRs and go through the same gates
# (CI, QA, judge); nothing auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Our flow is feature PR -> develop -> promotion PR to main (#225): updates open against develop, never main.
    target-branch: develop
    schedule:
      interval: weekly
    # Temporary history-cleanup freeze. Restore this to 5 after rewritten refs are published.
    open-pull-requests-limit: 0
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    # Temporary history-cleanup freeze. Remove this line after rewritten refs are published.
    open-pull-requests-limit: 0
