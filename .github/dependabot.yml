# Weekly dependency and workflow-action update PRs (#22). Updates arrive as ordinary PRs and go through the same gates
# (CI, QA, judge); nothing auto-merges.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
