name: Gitleaks

# #3 — secret scanning, independent of the main CI job (no Node setup needed).
# Mirrors the pattern in C-Azzone416/tabletop-sim (read only reference).
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    # PR mode calls GET /pulls/:number/commits to scan just the PR's diff;
    # pull-requests: read is the documented minimum for that call.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
