name: CI

# #3 — quality gates for every PR to develop/main. No repository secrets are
# used; tests never touch a real database. Deployment is separate (#20).
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One workflow, several jobs that run at the same time (#87). `ci` at the bottom is the single job that branch protection
# requires and the deploy waits on: it passes only when every other job passed, so adding or renaming the jobs above it never
# changes what is required. Timeouts are explicit on every job and nest with the deploy's wait (`npm run check:workflows`).
jobs:
  # SCRATCH (not for merge): stand-ins for the real jobs, to watch the real `ci` summary job below react.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "checks ok this time"
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - run: echo unit ok
  build:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo "build is skipped on purpose"
  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo e2e-build ok
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2]
    steps:
      - run: echo e2e ok

  ci:
    needs: [checks, unit, build, e2e-build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
