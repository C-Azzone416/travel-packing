name: CI

# #3 — quality gates for every PR to develop/main. No repository secrets are
# used; tests never touch a real database. Deployment is separate (#20).
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails on any committed file over 1 MiB or any local database, build, test, dependency, or env file.
      - name: Repository hygiene
        run: npm run check:repo-hygiene

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # vitest exits non-zero when any coverage threshold (90%) is missed.
      # An explicit `shell: bash` enables pipefail (the default shell does
      # not), so piping through tee cannot mask that failure.
      - name: Test with coverage
        shell: bash
        run: npm run test:coverage 2>&1 | tee coverage-summary.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            cat coverage-summary.txt 2>/dev/null || echo 'no coverage output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      # The e2e-only fake sign-in must not be in a deployable build. This build is made without
      # NEXT_PUBLIC_E2E_BUILD, exactly like production; the e2e step below rebuilds with it.
      - name: Verify the e2e-only sign-in is not in the build
        run: npm run check:no-e2e-in-build

      # The same guarantee must hold for the webpack bundler (`next build --webpack`), not only Turbopack.
      - name: Build with webpack
        run: npm run build:webpack

      - name: Verify the e2e-only sign-in is not in the webpack build
        run: npm run check:no-e2e-in-build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E (phone + desktop)
        run: npm run test:e2e

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            coverage-summary.txt
          if-no-files-found: ignore

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
