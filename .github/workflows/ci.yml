name: CI

# #3 — quality gates for every PR to develop/main. No repository secrets are
# used; tests never touch a real database. Deployment is separate (#20).
on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One workflow, several jobs that run at the same time (#87). `ci` at the bottom is the single job that branch protection
# requires and the deploy waits on: it passes only when every other job passed, so adding or renaming the jobs above it never
# changes what is required. Timeouts are explicit on every job and nest with the deploy's wait (`npm run check:workflows`).
jobs:
  # Fast, independent static checks.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails on any committed file over 1 MiB or any local database, build, test, dependency, or env file.
      - name: Repository hygiene
        run: npm run check:repo-hygiene

      # Workflow syntax and expressions (actionlint, a pinned release verified by its published SHA-256, run from a
      # temp directory), then our own contract: every action pinned to a full SHA, the deploy workflow's safety
      # rules (#20), and the timeouts. Neither prints a secret or environment value.
      - name: Lint workflows (actionlint, pinned)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Workflow contract (pinned actions, deploy safety rules, timeouts)
        run: npm run check:workflows

      # Known-vulnerable runtime dependencies fail the build (#22). Dev-only tooling is Dependabot's job.
      - name: Dependency audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # Unit and integration tests with the 90% coverage gate.
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # vitest exits non-zero when any coverage threshold (90%) is missed.
      # An explicit `shell: bash` enables pipefail (the default shell does
      # not), so piping through tee cannot mask that failure.
      - name: Test with coverage
        shell: bash
        run: npm run test:coverage 2>&1 | tee coverage-summary.txt

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage'
            echo '```'
            cat coverage-summary.txt 2>/dev/null || echo 'no coverage output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: |
            coverage/
            coverage-summary.txt
          if-no-files-found: ignore

  # The deployable builds, exactly as production makes them (no NEXT_PUBLIC_E2E_BUILD), and the scans that prove they
  # carry no test-only code and no secrets. Both bundlers.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # The e2e-only fake sign-in must not be in a deployable build. This build is made without
      # NEXT_PUBLIC_E2E_BUILD, exactly like production; the e2e-build job makes its own build with it.
      - name: Verify the e2e-only sign-in is not in the build
        run: npm run check:no-e2e-in-build

      # Nothing the browser can download may name a server secret, hold a secret-shaped value, or contain server-only
      # code (#22). The scan's own tests inject a fake secret and require it to fail.
      - name: Scan the client bundle for secrets and server-only code
        run: npm run check:client-bundle

      # The same guarantee must hold for the webpack bundler (`next build --webpack`), not only Turbopack.
      - name: Build with webpack
        run: npm run build:webpack

      - name: Verify the e2e-only sign-in is not in the webpack build
        run: npm run check:no-e2e-in-build

      - name: Scan the webpack client bundle
        run: npm run check:client-bundle

  # The one build the browser tests run against: the app compiled WITH the e2e-only sign-in and database driver
  # (NEXT_PUBLIC_E2E_BUILD=1), which is why it cannot be the production build above. Made once and handed to both e2e jobs
  # as an artifact, so neither rebuilds. It is never deployed: it is not uploaded anywhere but this workflow run.
  e2e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build for e2e
        env:
          NEXT_PUBLIC_E2E_BUILD: "1"
        run: npm run build

      # Hidden folder, so it must be asked for by name; the build cache is not needed to start the app.
      - name: Upload the e2e build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-build
          path: |
            .next
            !.next/cache
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  # Phone and desktop at the same time, each in two shards. Every runner has its own database (started per run, in memory), so
  # none share state; the tests already sign in as a different owner per project, and each starts from a freshly seeded owner.
  e2e:
    name: e2e (${{ matrix.project }} ${{ matrix.shard }}/2)
    needs: e2e-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [phone, desktop]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Download the e2e build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: e2e-build
          path: .next

      - name: Check the build arrived
        run: test -f .next/BUILD_ID

      # The browser download is cached by Playwright version. The system libraries it needs are installed every run
      # (`--with-deps`); only the download is skipped on a cache hit.
      - name: Playwright version
        id: playwright
        run: echo "version=$(npx playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # E2E_PREBUILT makes Playwright start the downloaded build instead of building again (playwright.config.ts).
      - name: E2E (${{ matrix.project }} ${{ matrix.shard }}/2)
        env:
          E2E_PREBUILT: "1"
          E2E_PROJECT: ${{ matrix.project }}
          E2E_SHARD: ${{ matrix.shard }}
        run: npx playwright test --project="$E2E_PROJECT" --shard="$E2E_SHARD/2"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  # THE required check. It stays named `ci` (branch protection and the deploy's "Require green CI" both depend on that),
  # runs even when something above failed or was cancelled, and passes only if every job above succeeded. A skipped job
  # does not count as success.
  ci:
    needs: [checks, unit, build, e2e-build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
