name: Deploy to Vercel

# A push to develop deploys a preview, automatically. Production is NEVER deployed by a push: it is released by hand, with
# a manual run ("Run workflow") on main by the repository owner who types the full SHA of the commit being released (the
# `gate` job below enforces it; see "Production release gate" in docs/deploy.md). No direct GitHub-Vercel integration.
# Each deploy runs in the GitHub environment `preview` or `production` (each restricted to its branch), and each holds
# its OWN DATABASE_URL_UNPOOLED secret, so a preview run can never read production's.
on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      release_sha:
        description: Production only. Type the full 40-character SHA of the commit on main being released.
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to read the `ci` result for this commit

env:
  VERCEL_CLI_VERSION: 64.5.0 # pinned (never a moving tag)
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  # Decides what this run may deploy before any secret or protected environment is in reach. Fails the run otherwise.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.gate.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Release gate (which target may this run deploy?)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npx tsx scripts/release-gate.ts

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 75 # includes the wait for CI below (up to 50 minutes) plus the build, migration and deploy
    environment: ${{ needs.gate.outputs.target }}
    env:
      TARGET: ${{ needs.gate.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Require green CI for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 100); do
            conclusion=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json status,conclusion \
              --jq '[.[] | select(.status == "completed")] | first | .conclusion // "pending"')
            echo "ci for $GITHUB_SHA: $conclusion"
            case "$conclusion" in
              success) exit 0 ;;
              pending) sleep 30 ;;
              *) echo "CI did not succeed; not deploying." >&2; exit 1 ;;
            esac
          done
          echo "Timed out waiting for CI." >&2
          exit 1

      - name: Install Vercel CLI (pinned)
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      # VERCEL_TOKEN can deploy to production, so only the two Vercel steps that talk to Vercel (pull and deploy) get it (not `npm ci`, whose
      # install scripts run before this point, nor the build, migrate or seed steps).
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      # Preview only. `vercel pull` cannot read a Vercel Secret (they are write-only) and writes a redaction marker in its place,
      # so these four are written into the pulled file from the GitHub `preview` environment's secrets. They reach the script only
      # through this step's env: (from secrets.*, so GitHub masks them) and are never printed. The step does not run for a
      # production deploy, which never receives them. Rotating one means updating Vercel AND the GitHub preview environment.
      # Which builder the build uses depends on the project's settings (framework preset and build/output/root/install
      # overrides), which live in Vercel, not the repo. Print those five settings (never anything else from the file).
      - name: Show the Vercel project's build settings
        run: npx tsx scripts/print-project-settings.ts

      - name: Inject the Preview secrets (values not shown)
        if: env.TARGET == 'preview'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          OWNER_EMAIL_ALLOWLIST: ${{ secrets.OWNER_EMAIL_ALLOWLIST }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
        run: npx tsx scripts/inject-preview-secrets.ts ".vercel/.env.${TARGET}.local"

      - name: Check the deploy environment (names only, no values)
        env:
          PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DB_HOST }}
        run: npx tsx scripts/check-deploy-env.ts "$TARGET" ".vercel/.env.${TARGET}.local"

      # `vercel build` works from the files `vercel pull` wrote; it needs no token (so the build, which runs project
      # code, never sees one).
      - name: Build
        run: |
          if [ "$TARGET" = production ]; then vercel build --prod; else vercel build; fi

      # An output without server functions deploys "fine" and then answers every request with a 404; stop before uploading it.
      - name: The build output has server functions
        run: npx tsx scripts/check-build-output.ts

      - name: No test-only code in the build
        run: npm run check:no-e2e-in-build

      # The migrate and seed steps use the GitHub environment's secret, which the Vercel env check never sees. Prove it
      # points at the right database first: not production in a preview run, production in a production run.
      - name: Check the migration target
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DB_HOST }}
        run: npx tsx scripts/check-migration-target.ts "$TARGET"

      - name: Apply database migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          echo "Migrating the $TARGET database"
          npm run db:migrate:remote

      # Preview only. An unset PREVIEW_SEED_OWNER_ID is the first-preview bootstrap: the step logs a visible skip and the run
      # continues (the owner cannot exist until the sign-up screens are deployed). Never reads the production secret.
      - name: Seed synthetic data (preview only; skipped until the owner id exists)
        if: env.TARGET == 'preview'
        env:
          SEED_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          SEED_ALLOWED_HOSTS: ${{ vars.PREVIEW_DB_HOST }}
          SEED_OWNER_ID: ${{ vars.PREVIEW_SEED_OWNER_ID }}
          PRODUCTION_DB_HOST: ${{ vars.PRODUCTION_DB_HOST }}
        run: npm run db:seed:preview

      # Preview deploys name their target outright: without it Vercel assigns a project's FIRST deployment to production. The CLI's
      # own output (it prints which kind it made) is kept for the next step, which fails the run if the target is not the one meant.
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          log="$RUNNER_TEMP/deploy.log"
          status=0
          if [ "$TARGET" = production ]; then
            url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" 2>"$log") || status=$?
          else
            url=$(vercel deploy --prebuilt --target=preview --token="$VERCEL_TOKEN" 2>"$log") || status=$?
          fi
          cat "$log" >&2
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed ($TARGET): $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deployment landed in the right environment
        run: npx tsx scripts/check-deploy-target.ts "$TARGET" "$RUNNER_TEMP/deploy.log"

      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx tsx scripts/smoke-test.ts "$DEPLOY_URL"
