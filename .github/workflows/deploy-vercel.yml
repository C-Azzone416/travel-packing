name: Deploy to Vercel

# The preview deploy is CALLED by ci.yml (its `deploy` job, `needs: ci`) after a green push to develop, so there is no
# second workflow polling for CI. Production is NEVER deployed by a push: it is released by hand, with a manual run
# ("Run workflow") on main by the repository owner who types the full SHA of the commit being released (the `gate` job
# below enforces it; see "Production release gate" in docs/deploy.md). In a called workflow the event, ref and sha are the
# caller's, so the gate sees a push to develop and can only choose preview. No direct GitHub-Vercel integration.
# Each deploy runs in the GitHub environment `preview` or `production` (each restricted to its branch), and each holds
# its OWN DATABASE_URL_UNPOOLED secret, so a preview run can never read production's.
on:
  workflow_call:
    inputs:
      release_sha:
        description: Production only (never passed by the caller). The full SHA of the commit being released.
        required: false
        type: string
  workflow_dispatch:
    inputs:
      release_sha:
        description: Production only. Type the full 40-character SHA of the commit on main being released.
        required: false
        type: string

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read # to read the `ci` result for this commit
  packages: read # installs the private @masra91/framebriar package

env:
  VERCEL_CLI_VERSION: 64.5.0 # pinned (never a moving tag)
  PREVIEW_ALIAS: travel-packing-preview.vercel.app # the one stable Preview address (also PREVIEW_ORIGIN in request-origin.ts)
  PRODUCTION_ALIAS: packed-smart.vercel.app # the public Production address: smoke-tested only after it is proven to serve THIS deployment (#207)
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

# GitHub prints every step's `env:` values in the run log and masks only secret values. So the production host name and the
# preview owner's user id are read from the secret store here (they show as ***), never from variables, which print.
jobs:
  # Decides what this run may deploy before any secret or protected environment is in reach. Fails the run otherwise.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      target: ${{ steps.gate.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }} # read access to the private @masra91/framebriar package (install steps only)
        run: npm ci

      - name: Release gate (which target may this run deploy?)
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
          REPO_OWNER: ${{ github.repository_owner }}
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: npx tsx scripts/release-gate.ts

  deploy:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the build, migration and deploy; the CI check below is a single look, not a wait
    environment: ${{ needs.gate.outputs.target }}
    env:
      TARGET: ${{ needs.gate.outputs.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }} # read access to the private @masra91/framebriar package (install steps only)
        run: npm ci

      # A preview deploy only exists after `ci` passed (the caller's `needs: ci`). A manual production run has no such
      # guarantee, so it looks once, at this exact commit: a green, completed, latest `ci` run, or it stops. No waiting.
      - name: Require green CI for this commit (production)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx tsx scripts/require-ci.ts "$GITHUB_SHA"

      # The Vercel CLI comes from its own lockfile (tools/vercel-cli: the version below, every transitive and its integrity hash),
      # installed reproducibly with scripts off, and put on the PATH from there. Nothing is resolved or downloaded after this step:
      # no global install, no npx. The steps below that hold VERCEL_TOKEN run THIS binary (#208).
      - name: Install the locked Vercel CLI
        run: npm ci --prefix tools/vercel-cli --ignore-scripts

      - name: Put the locked Vercel CLI on the PATH
        run: echo "$GITHUB_WORKSPACE/tools/vercel-cli/node_modules/.bin" >> "$GITHUB_PATH"

      # VERCEL_TOKEN can deploy to production, so only the two Vercel steps that talk to Vercel (pull and deploy) get it (not `npm ci`, whose
      # install scripts run before this point, nor the build, migrate or seed steps).
      - name: Pull Vercel environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment="$TARGET" --token="$VERCEL_TOKEN"

      # `vercel pull` cannot read a Vercel Secret (they are write-only) and writes a redaction marker in its place, so
      # these four are written into the pulled file from the selected GitHub environment's secrets. Preview and Production
      # carry separate values under the same names. They reach the script only through secrets.* (so GitHub masks them)
      # and are never printed. Rotating one means updating Vercel AND the matching GitHub environment.
      # Which builder the build uses depends on the project's settings (framework preset and build/output/root/install
      # overrides), which live in Vercel, not the repo. Print those five settings (never anything else from the file).
      - name: Show the Vercel project's build settings
        run: npx tsx scripts/print-project-settings.ts

      - name: Inject deployment secrets (values not shown)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          OWNER_EMAIL_ALLOWLIST: ${{ secrets.OWNER_EMAIL_ALLOWLIST }}
          NEON_AUTH_COOKIE_SECRET: ${{ secrets.NEON_AUTH_COOKIE_SECRET }}
        run: npx tsx scripts/inject-deploy-secrets.ts ".vercel/.env.${TARGET}.local"

      - name: Check the deploy environment (names only, no values)
        env:
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
        run: npx tsx scripts/check-deploy-env.ts "$TARGET" ".vercel/.env.${TARGET}.local"

      # `vercel build` works from the files `vercel pull` wrote; it needs no token (so the build, which runs project
      # code, never sees one).
      - name: Build
        run: |
          if [ "$TARGET" = production ]; then VERCEL_ENV=production FEEDBACK_SCREENSHOTS=0 vercel build --prod; else vercel build; fi

      # An output without server functions deploys "fine" and then answers every request with a 404; stop before uploading it.
      - name: The build output has server functions
        run: npx tsx scripts/check-build-output.ts

      - name: No test-only code in the build
        run: npm run check:no-e2e-in-build

      # The migrate and seed steps use the GitHub environment's secret, which the Vercel env check never sees. Prove it
      # points at the right database first: not production in a preview run, production in a production run.
      - name: Check the migration target
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
        run: npx tsx scripts/check-migration-target.ts "$TARGET"

      - name: Apply database migrations
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          echo "Migrating the $TARGET database"
          npm run db:migrate:remote

      # Preview only. An unset PREVIEW_SEED_OWNER_ID is the first-preview bootstrap: the step logs a visible skip and the run
      # continues (the owner cannot exist until the sign-up screens are deployed). Never reads the production secret.
      - name: Seed synthetic data (preview only; skipped until the owner id exists)
        if: env.TARGET == 'preview'
        env:
          SEED_DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}
          SEED_ALLOWED_HOSTS: ${{ vars.PREVIEW_DB_HOST }}
          SEED_OWNER_ID: ${{ secrets.PREVIEW_SEED_OWNER_ID }}
          PRODUCTION_DB_HOST: ${{ secrets.PRODUCTION_DB_HOST }}
        run: npm run db:seed:preview

      # Preview deploys name their target outright: without it Vercel assigns a project's FIRST deployment to production. The CLI's
      # own output (it prints which kind it made) is kept for the next step, which fails the run if the target is not the one meant.
      - name: Deploy
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          log="$RUNNER_TEMP/deploy.log"
          status=0
          if [ "$TARGET" = production ]; then
            url=$(vercel deploy --prebuilt --prod --meta releaseSha="$GITHUB_SHA" --token="$VERCEL_TOKEN" 2>"$log") || status=$?
          else
            url=$(vercel deploy --prebuilt --target=preview --meta releaseSha="$GITHUB_SHA" --token="$VERCEL_TOKEN" 2>"$log") || status=$?
          fi
          cat "$log" >&2
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: SUCCEEDED ($TARGET): $url. The checks after it (alias proof, smoke test) are reported on their own lines." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the deployment landed in the right environment
        run: npx tsx scripts/check-deploy-target.ts "$TARGET" "$RUNNER_TEMP/deploy.log"

      # ---- Production (#207) --------------------------------------------------------------------------------------------
      # A production deployment's generated address is behind Vercel Authentication, so it is never smoke-tested: the public alias
      # is. But a stale alias still answers 200 from the PREVIOUS release, so first prove it serves THIS deployment, from THIS
      # commit (read-only Vercel REST calls; fails closed, and says so on its own summary line). The alias is smoke-tested without
      # the bypass secret: production has none, and a Vercel Authentication answer is a failure there, never a pass.
      - name: Prove the Production alias belongs to this deployment
        if: env.TARGET == 'production'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx tsx scripts/verify-production-alias.ts "$DEPLOY_URL" "$PRODUCTION_ALIAS"

      - name: Production alias smoke test
        if: env.TARGET == 'production'
        run: npx tsx scripts/smoke-test.ts "https://${PRODUCTION_ALIAS}"

      - name: Smoke test
        if: env.TARGET == 'preview'
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx tsx scripts/smoke-test.ts "$DEPLOY_URL"

      # ---- the stable Preview alias (#96) -------------------------------------------------------------------------------
      # Reached only after a successful deploy AND smoke test: an earlier failing step ends the job, and none of these steps
      # uses always() or failure(), so a failed build, deploy or smoke test never touches the alias. Production never gets one.
      # Deploys are serialized by this workflow's concurrency group and never cancelled; an older run can still finish after a
      # newer push, so the alias moves only if this run's commit is STILL the develop head.
      - name: Is this run still the develop head? (preview only)
        id: alias_head
        if: env.TARGET == 'preview'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/develop" --jq .object.sha)
          npx tsx scripts/check-alias-head.ts "$GITHUB_SHA" "$head"

      # Not `vercel alias set`: the CLI loads the token's USER first (GET /v2/user), which answers 404 for this token, so it fails
      # with "User not found." however the scope is given (develop runs after #99 and #100). The script makes the two documented
      # REST calls instead (look up the deployment, assign the alias), with the same token and the team id.
      - name: Assign the stable Preview alias
        if: env.TARGET == 'preview' && steps.alias_head.outputs.assign == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx tsx scripts/assign-alias.ts "$DEPLOY_URL" "$PREVIEW_ALIAS"

      - name: Smoke test the alias
        if: env.TARGET == 'preview' && steps.alias_head.outputs.assign == 'true'
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npx tsx scripts/smoke-test.ts "https://${PREVIEW_ALIAS}"

      # ---- tidy up (#135) -----------------------------------------------------------------------------------------------
      # Caroline's retention decision: only the stable alias address stays reachable, so every other Preview deployment of this
      # project is deleted, but only now, after the alias moved and its smoke test passed, and never a Production one. The script
      # confirms the alias target itself (two ways) and deletes nothing if it cannot; it logs counts only and always exits 0, so
      # tidying up can never fail a deploy that already succeeded. The first run after this lands also clears the old backlog.
      - name: Delete superseded Preview deployments
        if: env.TARGET == 'preview' && steps.alias_head.outputs.assign == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx tsx scripts/cleanup-previews.ts "$DEPLOY_URL" "$PREVIEW_ALIAS"
