<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Dashboard status color comparison</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px; background: #f5f7f2; color: #183d45; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: -.03em; }
    p { margin: 0 0 22px; color: #60777b; }
    .comparison { display: grid; grid-template-columns: repeat(2, 390px); gap: 24px; }
    figure { margin: 0; }
    figcaption { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; font-size: 17px; font-weight: 800; }
    figcaption span { border-radius: 999px; padding: 5px 10px; background: white; border: 1px solid #d9e3df; color: #60777b; font-size: 12px; }
    img { display: block; width: 390px; border: 1px solid #d9e3df; border-radius: 20px; box-shadow: 0 12px 30px rgba(24,61,69,.1); }
  </style>
</head>
<body>
  <h1>Dashboard status colors</h1>
  <p>Same phone layout; only the trip-status badge palette changes.</p>
  <div class="comparison">
    <figure><figcaption>Before <span>Original</span></figcaption><img src="phone-dashboard-before-statuses.png" alt="Dashboard with the previous status badge colors" /></figure>
    <figure><figcaption>Candidate <span>Palette trial</span></figcaption><img src="phone-dashboard.png" alt="Dashboard with the apricot left-to-pack badge candidate" /></figure>
  </div>
</body>
</html>
